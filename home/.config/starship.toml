# Starship prompt — https://starship.rs/config
# Symlinked from crrow/dotfiles.

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch$git_status\
$rust$golang$nodejs$python\
$cmd_duration\
$line_break$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "yellow"

[cmd_duration]
min_time = 2_000
format = " [$duration](dim yellow)"
